<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 30" width="1000" height="30">
<defs><linearGradient id="d" x1="0" x2="1"><stop offset="0" stop-color="#00e5ff" stop-opacity="0"/><stop offset="0.3" stop-color="#00e5ff"/><stop offset="0.7" stop-color="#ff2e97"/><stop offset="1" stop-color="#ff2e97" stop-opacity="0"/></linearGradient>
